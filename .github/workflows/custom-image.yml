name: Custom image

on:
  push:
    branches: [custom]
  workflow_dispatch:

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          version=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${version}-custom.${GITHUB_SHA:0:9}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:custom
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.created }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=custom-image-amd64
          cache-to: type=gha,mode=max,scope=custom-image-amd64

      - name: Verify application and backup tools
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm "$IMAGE" /app/sub2api -version 2>&1 | tee /tmp/sub2api-version.txt
          grep -F "$VERSION" /tmp/sub2api-version.txt
          docker run --rm "$IMAGE" pg_dump --version
          docker run --rm "$IMAGE" psql --version

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:custom"
          {
            echo '### Published image (linux/amd64)'
            echo "- Rolling tag: \`$IMAGE:custom\`"
            echo "- Commit tag: \`$IMAGE:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
