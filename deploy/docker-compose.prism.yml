# Overlay for docker-compose.yml / docker-compose.local.yml (service: sub2api).
# Copy prism-adapter/seccomp_profile.json alongside this file before deployment.
services:
  prism:
    image: ${PRISM_IMAGE:-ghcr.io/aicoder-pzy/sub2api-group-prism:custom}
    restart: unless-stopped
    init: true
    network_mode: service:sub2api
    depends_on:
      sub2api:
        condition: service_started
    env_file:
      - .prism.env
    environment:
      PRISM_ADAPTER_MODE: browser
      PRISM_ADAPTER_CLIENT_TOOLS_ENABLED: "false"
    volumes:
      - prism_state:/var/lib/sub2api-prism
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/prism:size=64m,uid=10001,gid=10001,mode=0700
    shm_size: 256m
    mem_limit: 900m
    memswap_limit: 900m
    cpus: 1
    pids_limit: 256
    security_opt:
      - seccomp=./seccomp_profile.json

volumes:
  prism_state:
